name: Render Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *" # Run every 10 minutes
  workflow_dispatch: # Allow manual runs from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render app
        run: |
          # Cold starts can take around 50 seconds; retry transient failures.
          curl --silent --show-error --location \
            --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            --fail \
            "https://drowiness-detector.onrender.com/"
