{% extends 'base.html' %}

{% block title %}Forgot Password - Drowsiness Prevention System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
            
            <button type="submit" class="btn primary btn-full">Send Reset Link</button>
        </form>
        
        <div class="auth-footer">
            <p>Remember your password? <a href="{{ url_for('login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
