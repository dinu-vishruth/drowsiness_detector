{% extends 'base.html' %}

{% block title %}Admin Login - Drowsiness Prevention System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2 class="auth-title">🛡️ Administrator Login</h2>
        <p class="auth-subtitle">Restricted area. Sign in with administrator credentials.</p>

        <form method="POST" action="{{ url_for('admin_login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn primary btn-full">Sign In as Admin</button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('login') }}">← Back to user login</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        button.textContent = '🙈';
    } else {
        input.type = 'password';
        button.textContent = '👁️';
    }
}
</script>
{% endblock %}
